<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Abdulaziz — Data, code and connected systems</title>
  <desc id="desc">A dark blue banner with a moving chart, green data points and the words Python, SQL and IoT.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#12293c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <rect x="48" y="46" width="4" height="20" rx="2" fill="#34d399"/>
  <text x="66" y="61" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#94a3b8">CODE BY ABDULAZIZ</text>
  <text x="48" y="145" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#f8fafc">Hi, I'm Abdulaziz.</text>
  <text x="50" y="194" font-family="Arial, sans-serif" font-size="26" fill="#cbd5e1">Data, code and connected systems.</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">
    <rect x="48" y="234" width="112" height="34" rx="17" fill="#162a3c" stroke="#294255"/><text x="104" y="256">PYTHON</text>
    <rect x="172" y="234" width="85" height="34" rx="17" fill="#162a3c" stroke="#294255"/><text x="214" y="256">SQL</text>
    <rect x="269" y="234" width="85" height="34" rx="17" fill="#162a3c" stroke="#294255"/><text x="311" y="256">IoT</text>
  </g>
  <g transform="translate(806 64)">
    <rect width="334" height="204" rx="14" fill="#0b1726" stroke="#294255"/>
    <circle cx="19" cy="19" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <text x="33" y="23" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#94a3b8">BUILD / ANALYZE / LEARN</text>
    <g stroke="#24384b" stroke-width="1"><path d="M24 68H310M24 108H310M24 148H310M24 180H310"/></g>
    <g fill="#1e4960"><rect x="34" y="145" width="22" height="35" rx="3"/><rect x="78" y="125" width="22" height="55" rx="3"/><rect x="122" y="133" width="22" height="47" rx="3"/><rect x="166" y="96" width="22" height="84" rx="3"/><rect x="210" y="106" width="22" height="74" rx="3"/><rect x="254" y="66" width="22" height="114" rx="3"/></g>
    <path d="M32 142L78 121L124 134L170 89L216 102L274 54L304 62" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 142L78 121L124 134L170 89L216 102L274 54L304 62" fill="none" stroke="#d1fae5" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 360"><animate attributeName="stroke-dashoffset" from="368" to="0" dur="4s" repeatCount="indefinite"/></path>
    <circle cx="274" cy="54" r="5" fill="#34d399"/><circle cx="274" cy="54" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;16" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="48" y="306" width="1092" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
</svg>
